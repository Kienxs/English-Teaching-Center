<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments :: headInfo('Đăng nhập', ~{:: .custom-css})}">
   <link class="custom-css" rel="stylesheet" href="/css/login.css"/>
   <script class="custom-css" src="https://www.google.com/recaptcha/api.js?hl=vi"></script>
   <script class="custom-css" src="/js/auth-logic.js"></script>
</head>
<body>
  <nav class="navbar m-r m-l">
        <div class="row">
            <a th:href="@{/landing}"><img src="/images/landing/logo.png" alt="logo"></a>

            <button class="menu-toggle" id="menu-toggle-button">
                <img src="/images/list.png" alt="list"> 
            </button>

            <ul id="nav-links">
                <li><a th:href="@{/login}">Đăng Nhập</a></li>
                <li><a th:href="@{/register}">Đăng ký</a></li>
            </ul>
        </div>
    </nav>

  <div class="main-content">
    <div class="login-container">
      <div class="login-left">
        <img src="/images/login/login.jpg" alt="login illustration">
      </div>

      <div class="login-right">
          <h2>Đăng nhập</h2>
          <form id="loginForm" th:action="@{/process-login}" method="post">
              
              <label for="username">Email <span>*</span></label>
              <input type="text" id="username" name="username" placeholder="Nhập email" required tabindex="1">

              <label for="password">Mật khẩu <span>*</span></label>
              <div class="password-wrapper">
                  <input type="password" id="password" name="password" placeholder="Nhập mật khẩu" required tabindex="2">
                  <span class="toggle-password">👁️</span>
              </div>

              <div class="g-recaptcha" th:attr="data-sitekey=${recaptchaSiteKey}" style="margin-bottom: 15px;"></div>

              <div class="options">
                  <a th:href="@{/forgot-password}">Quên mật khẩu?</a>
              </div>

              <button type="submit" id="btnLogin" class="btn-login" tabindex="4">Đăng nhập</button>
              <p class="register-link">Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a></p>
          </form>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments :: footer}"></div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Logic ẩn hiện mật khẩu
        const toggleBtn = document.querySelector('.toggle-password');
        const passInput = document.querySelector('#password');
        if(toggleBtn && passInput) {
            toggleBtn.addEventListener('click', () => {
                passInput.type = passInput.type === 'password' ? 'text' : 'password';
                toggleBtn.textContent = passInput.type === 'password' ? '👁️' : '🙈';
            });
        }

        // 2. Lấy dữ liệu từ Controller qua Thymeleaf
        const success = /*[[${successMessage}]]*/ null;
        const error = /*[[${errorMessage}]]*/ null;
        const captcha = /*[[${captchaErrorMessage}]]*/ null;
        const kickedMsg = /*[[${kickedMessage}]]*/ null;

        // 3. Gọi hàm từ auth-logic.js
        initAuthFeatures(success, error, captcha, kickedMsg);
    });
</script>
</body>
</html>
