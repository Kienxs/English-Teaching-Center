<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{teacher/fragments_teacher :: teacher-head('Chỉnh sửa Blog', ~{:: .page-asset})}">
    <link class="page-asset" rel="stylesheet" href="/css/teacher/course-edit.css">
    <link class="page-asset" rel="stylesheet" href="/css/teacher/post-edit.css">
</head>
<body>
    <div th:replace="~{teacher/fragments_teacher :: teacher-sidebar('posts')}"></div>

    <div class="main-content">
        <form th:action="@{/teacher/post/save}" method="post" th:object="${post}" id="blogForm">
            <input type="hidden" th:field="*{id}" id="currentBlogId">
            <input type="hidden" th:field="*{slug}" id="currentBlogSlug">
            
            <div class="page-header">
                <h2 th:text="${post.id == null ? 'Tạo bài Blog mới' : 'Chỉnh sửa: ' + post.title}">Tiêu đề</h2>
                <div style="display: flex; align-items: center; gap: 10px;">
                    <span id="saveStatus"><i class="fa-solid fa-check"></i> Đã lưu nháp</span>
                    
                    <button type="button" class="btn btn-primary" onclick="validateAndSubmit()">
                        <i class="fa-solid fa-floppy-disk"></i> Lưu Bài Viết
                    </button>
                </div>
            </div>

            <div th:if="${successMessage}" class="alert alert-success" style="color: green; margin-bottom: 10px;">[[${successMessage}]]</div>
            <div th:if="${errorMessage}" class="alert alert-danger" style="color: red; margin-bottom: 10px;">[[${errorMessage}]]</div>

            <div class="grid-container">
                <div class="left-col">
                    <div class="card">
                        <div class="card-header">Thông tin chung</div>
                        <div class="form-group">
                            <label class="form-label">Tiêu đề bài viết <span style="color:red">*</span></label>
                            
                            <input type="text" class="form-control" th:field="*{title}" id="blogTitleInput" 
                                   oninput="updateBlogSlug(); clearError(this)" 
                                   onblur="autoSaveDraft()"
                                   placeholder="Nhập tiêu đề..." required>
                            <div class="error-message" id="titleError">Vui lòng nhập tiêu đề bài viết!</div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Tóm tắt (Summary)</label>
                            <textarea class="form-control" th:field="*{summary}" rows="3" onblur="autoSaveDraft()" placeholder="Mô tả ngắn gọn nội dung bài viết..."></textarea>
                        </div>
                    </div>

                    <div id="sections-container">
                        <div th:each="section, stat : *{sections}" class="section-block" th:id="'section-' + ${stat.index}">
                            <div class="section-header">
                                <span class="section-title">Mục #<span th:text="${stat.index + 1}"></span></span>
                                <button type="button" class="btn-remove-section" th:onclick="'removeSection(' + ${stat.index} + ')'"><i class="fa-solid fa-trash"></i> Xóa mục này</button>
                            </div>
                            
                            <input type="hidden" th:field="*{sections[__${stat.index}__].id}">
                            
                            <div class="form-group">
                                <label>Tiêu đề mục con</label>
                                <input type="text" class="form-control" th:field="*{sections[__${stat.index}__].sectionTitle}" placeholder="Ví dụ: 1. Giới thiệu...">
                            </div>

                            <div class="form-group">
                                <label>Nội dung chi tiết</label>
                                <textarea th:field="*{sections[__${stat.index}__].sectionContent}" th:id="'editor-' + ${stat.index}" class="editor-content"></textarea>
                            </div>

                            <div class="form-group">
                                <label>Ảnh minh họa (URL)</label>
                                <input type="text" class="form-control" th:field="*{sections[__${stat.index}__].imageUrl}" th:oninput="'previewSectionImage(this, ' + ${stat.index} + ')'" placeholder="https://...">
                                <div class="image-preview" th:id="'preview-box-' + ${stat.index}">
                                    <img th:if="${section.imageUrl != null && section.imageUrl != ''}" th:src="${section.imageUrl}">
                                    <span th:unless="${section.imageUrl != null && section.imageUrl != ''}"><i class="fa-regular fa-image"></i></span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn-add-section" onclick="addNewSection()">
                        <i class="fa-solid fa-plus-circle"></i> Thêm mục nội dung mới
                    </button>
                </div>

                <div class="right-col">
                    <div class="card">
                        <div class="card-header">Ảnh bìa (Thumbnail)</div>
                        <input type="text" class="form-control" th:field="*{thumbnailUrl}" id="thumbInput" oninput="previewMainThumb()" onblur="autoSaveDraft()">
                        <div class="image-preview" id="mainThumbPreview">
                            <img th:if="*{thumbnailUrl != null && thumbnailUrl != ''}" th:src="*{thumbnailUrl}">
                        </div>
                    </div>
                    
                    <div class="card">
                         <div class="card-header">Trạng thái</div>
                         <div th:text="*{status}" style="font-weight: bold; text-align: center; padding: 10px;"></div>
                         <div style="font-size: 12px; color: #666; margin-top: 10px;">
                             Slug: <span id="slugPreview" th:text="*{slug}"></span>
                         </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script src="https://cdn.ckeditor.com/ckeditor5/39.0.1/classic/ckeditor.js"></script>
    <script>
        const editors = {};
        
        let sectionCounter = document.querySelectorAll('.section-block').length;

        let saveTimeout = null;
        let isSaving = false;

        document.addEventListener("DOMContentLoaded", function() {
            document.querySelectorAll('.editor-content').forEach((textarea) => {
                initEditor(textarea);
            });
        });

        function initEditor(textareaElement) {
            ClassicEditor
                .create(textareaElement, { toolbar: ['heading', '|', 'bold', 'italic', 'link', 'bulletedList', 'numberedList', '|', 'undo', 'redo'] })
                .then(editor => {
                    editors[textareaElement.id] = editor; 
                })
                .catch(error => console.error(error));
        }

        function addNewSection() {
            const container = document.getElementById('sections-container');
            const index = sectionCounter++; 
            
            const html = `
                <div class="section-block" id="section-block-${index}">
                    <div class="section-header">
                        <span class="section-title">Mục mới</span>
                        <button type="button" class="btn-remove-section" onclick="removeSection(${index})"><i class="fa-solid fa-trash"></i> Xóa</button>
                    </div>
                    
                    <div class="form-group">
                        <label>Tiêu đề mục con</label>
                        <input type="text" class="form-control" name="sections[${index}].sectionTitle" placeholder="Nhập tiêu đề mục..." onblur="scheduleAutoSave()">
                    </div>

                    <div class="form-group">
                        <label>Nội dung chi tiết</label>
                        <textarea name="sections[${index}].sectionContent" id="editor-${index}"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Ảnh minh họa (URL)</label>
                        <input type="text" class="form-control" name="sections[${index}].imageUrl" oninput="previewSectionImage(this, ${index})" onblur="scheduleAutoSave()" placeholder="https://...">
                        <div class="image-preview" id="preview-box-${index}">
                            <span><i class="fa-regular fa-image"></i></span>
                        </div>
                    </div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', html);
            initEditor(document.querySelector(`#editor-${index}`));
            reIndexInputs(); 
        }

        function removeSection(index) {
            if(confirm("Bạn có chắc muốn xóa mục này?")) {
                document.getElementById(`section-block-${index}`).remove();
                
                if(editors[`editor-${index}`]) {
                    delete editors[`editor-${index}`];
                }
                
                reIndexInputs();
                scheduleAutoSave(); 
            }
        }

        function reIndexInputs() {
            const blocks = document.querySelectorAll('.section-block');
            blocks.forEach((block, newIndex) => {

                block.querySelector('.section-title').innerText = `Mục #${newIndex + 1}`;
                
                block.querySelectorAll('input, textarea').forEach(input => {
                    if(input.name && input.name.includes('sections[')) {
                        input.name = input.name.replace(/sections\[\d+\]/, `sections[${newIndex}]`);
                    }
                });
            });
        }

        function validateAndSubmit() {
            updateEditorsData();
            const titleInput = document.getElementById('blogTitleInput');
            const titleError = document.getElementById('titleError');

            if (!titleInput.value.trim()) {
                titleInput.classList.add('input-error');
                titleError.style.display = 'block';
                titleInput.focus();
                titleInput.animate([
                    { transform: 'translateX(0)' }, { transform: 'translateX(5px)' }, 
                    { transform: 'translateX(-5px)' }, { transform: 'translateX(0)' }
                ], { duration: 200 });
                return false;
            }
            document.getElementById('blogForm').submit();
        }

        function clearError(input) {
            input.classList.remove('input-error');
            document.getElementById('titleError').style.display = 'none';
        }

        function updateEditorsData() {
            for (const key in editors) {
                if (editors.hasOwnProperty(key)) {
                    editors[key].updateSourceElement();
                }
            }
        }

        function scheduleAutoSave() {
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                autoSaveDraft();
            }, 1500);
        }

        async function autoSaveDraft() {
            const titleInput = document.getElementById('blogTitleInput');
            if(!titleInput.value.trim()) return;

            if(isSaving) return; 

            isSaving = true; // Bật khóa
            const form = document.getElementById('blogForm');
            const statusLabel = document.getElementById('saveStatus');

            updateEditorsData();
            const formData = new FormData(form);

            statusLabel.innerHTML = '<div class="spinner" style="display:inline-block"></div> Đang lưu...';
            statusLabel.style.opacity = '1';
            statusLabel.style.color = '#666';

            try {
                const response = await fetch('/teacher/api/post/auto-save', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.id) {
                        document.getElementById('currentBlogId').value = data.id;
                        document.getElementById('currentBlogSlug').value = data.slug;

                        const newUrl = `/teacher/post/edit/${data.slug}`;
                        if (window.location.pathname !== newUrl) {
                            window.history.replaceState(null, '', newUrl);
                        }
                    }

                    statusLabel.innerHTML = '<i class="fa-solid fa-check"></i> Đã lưu nháp';
                    statusLabel.style.color = '#28a745';
                    setTimeout(() => { statusLabel.style.opacity = '0'; }, 3000);
                } else {
                    throw new Error("Save failed");
                }
            } catch (e) {
                console.error(e);
                statusLabel.innerText = 'Lỗi lưu tự động!';
                statusLabel.style.color = '#dc3545';
                setTimeout(() => { statusLabel.style.opacity = '0'; }, 3000);
            } finally {
                isSaving = false; // Mở khóa khi save xong (thành công hay thất bại đều mở)
            }
        }

        function previewSectionImage(input, index) {
            const url = input.value;
            const box = document.getElementById(`preview-box-${index}`);
            if(url) box.innerHTML = `<img src="${url}" onerror="this.src='/images/no-image.png'">`;
            else box.innerHTML = `<span><i class="fa-regular fa-image"></i></span>`;
        }

        function previewMainThumb() {
            const url = document.getElementById('thumbInput').value;
            const box = document.getElementById('mainThumbPreview');
            if(url) box.innerHTML = `<img src="${url}" onerror="this.src='/images/no-image.png'">`;
        }
        
        function updateBlogSlug() {
            const title = document.getElementById('blogTitleInput').value;
            const slug = title.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, "")
                .replace(/[đĐ]/g, 'd').replace(/([^0-9a-z-\s])/g, '').replace(/(\s+)/g, '-')
                .replace(/-+/g, '-').replace(/^-+|-+$/g, '');
            document.getElementById('slugPreview').innerText = slug || 'duong-dan-tu-dong';
        }
    </script>
</body>
</html>
