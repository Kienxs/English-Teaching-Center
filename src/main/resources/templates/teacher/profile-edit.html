<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${pageTitle}">Hồ sơ của tôi</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/teacher/course-edit.css">
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        .tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
        .tab-btn { padding: 12px 25px; cursor: pointer; border: none; background: none; font-size: 16px; color: #555; border-bottom: 3px solid transparent; transition: 0.3s; font-weight: 500;}
        .tab-btn:hover { color: #007bff; }
        .tab-btn.active { color: #007bff; border-bottom: 3px solid #007bff; }
        .tab-content { display: none; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05);}
        .tab-content.active { display: block; }
        .avatar-preview { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #ddd; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="brand"><i class="fa-solid fa-graduation-cap"></i> English Center</div>
        <a th:href="@{/teacher/dashboard}" class="menu-item"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
        <a th:href="@{/teacher/course-management}" class="menu-item"><i class="fa-solid fa-book-open"></i> Khóa học</a>
        <a th:href="@{/teacher/post-management}" class="menu-item"><i class="fa-solid fa-newspaper"></i> Blog cá nhân</a>
        <a th:href="@{/teacher/profile}" class="menu-item active"><i class="fa-solid fa-user-gear"></i> Hồ sơ</a>
    </div>

    <div class="main-content">
        <div class="page-header"><h2>Quản lý Hồ sơ</h2></div>

        <div th:if="${successMessage}" class="alert alert-success" style="color: green; padding: 10px; background: #e8f5e9; margin-bottom: 15px;">[[${successMessage}]]</div>
        <div th:if="${errorMessage}" class="alert alert-danger" style="color: red; padding: 10px; background: #fde8e8; margin-bottom: 15px;">[[${errorMessage}]]</div>

        <div class="tabs">
            <button class="tab-btn" th:classappend="${activeTab == 'general'} ? 'active' : ''" onclick="openTab('general')"><i class="fa-solid fa-id-card"></i> Thông tin cá nhân</button>
            <button class="tab-btn" th:classappend="${activeTab == 'expertise'} ? 'active' : ''" onclick="openTab('expertise')"><i class="fa-solid fa-chalkboard-user"></i> Chuyên môn</button>
            <button class="tab-btn" th:classappend="${activeTab == 'password'} ? 'active' : ''" onclick="openTab('password')"><i class="fa-solid fa-lock"></i> Đổi mật khẩu</button>
        </div>

        <div id="general" class="tab-content" th:classappend="${activeTab == 'general'} ? 'active' : ''">
            <form th:action="@{/teacher/profile/update-basic}" method="post" enctype="multipart/form-data" th:object="${userProfileDTO}">
                <div style="display: flex; gap: 30px;">
                    <div style="text-align: center;">
                        <img th:src="*{avatarUrl != null && avatarUrl != '' ? avatarUrl : '/images/home/avatar_clone.png'}" class="avatar-preview" id="previewImg">
                        <br>
                        <input type="file" name="avatarFile" id="avatarFile" accept="image/*" style="display: none;" onchange="previewFile()">
                        <button type="button" class="btn btn-secondary" style="background-color: #007bff;" onclick="document.getElementById('avatarFile').click()"><i class="fa-solid fa-upload"></i> Đổi ảnh</button>
                    </div>
                    <div style="flex: 1;">
                        <div class="form-group">
                            <label>Họ và Tên</label>
                            <input type="text" class="form-control" th:field="*{fullName}" required>
                        </div>
                        <div class="form-group" style="margin-top: 15px;">
                            <label>Số điện thoại</label>
                            <input type="text" class="form-control" th:field="*{phone}">
                        </div>
                        <div class="form-group" style="margin-top: 15px;">
                            <div class="g-recaptcha" th:data-sitekey="${recaptchaSiteKey}"></div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Lưu thông tin</button>
                    </div>
                </div>
            </form>
        </div>

        <div id="expertise" class="tab-content" th:classappend="${activeTab == 'expertise'} ? 'active' : ''">
            <form th:action="@{/teacher/profile/update-expertise}" method="post" th:object="${teacherProfile}">
                <div class="form-group">
                    <label>Chuyên môn (IELTS, TESOL...)</label>
                    <input type="text" class="form-control" th:field="*{expertise}">
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Link LinkedIn</label>
                    <input type="url" class="form-control" th:field="*{linkedinUrl}">
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Giới thiệu (Bio)</label>
                    <textarea class="form-control" th:field="*{bio}" rows="5"></textarea>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <div class="g-recaptcha" th:data-sitekey="${recaptchaSiteKey}"></div>
                </div>
                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Lưu chuyên môn</button>
            </form>
        </div>

        <div id="password" class="tab-content" th:classappend="${activeTab == 'password'} ? 'active' : ''">
            <form th:action="@{/teacher/profile/change-password}" method="post" th:object="${passwordChangeDTO}" style="max-width: 500px;">
                <div class="form-group">
                    <label>Mật khẩu hiện tại</label>
                    <input type="password" class="form-control" th:field="*{currentPassword}" required>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Mật khẩu mới</label>
                    <input type="password" class="form-control" th:field="*{newPassword}" required minlength="6">
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Nhập lại mật khẩu mới</label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}" required minlength="6">
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <div class="g-recaptcha" th:data-sitekey="${recaptchaSiteKey}"></div>
                </div>

                <button type="submit" class="btn btn-primary" style="margin-top: 15px;">Đổi mật khẩu</button>
            </form>
        </div>
    </div>

    <script>
        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabName).classList.add('active');
            event.currentTarget.classList.add('active');
            
            window.history.replaceState(null, null, "?tab=" + tabName);
        }

        function previewFile() {
            const file = document.getElementById('avatarFile').files[0];
            const reader = new FileReader();
            reader.onloadend = function () {
                document.getElementById('previewImg').src = reader.result;
            }
            if (file) reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
