<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{teacher/fragments_teacher :: teacher-head('Hồ sơ của tôi', ~{:: .page-asset})}">
    <link class="page-asset" rel="stylesheet" href="/css/teacher/course-edit.css">
    <link class="page-asset" rel="stylesheet" href="/css/teacher/profile-edit.css">
    <script class="page-asset" src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>
<body>
    <div th:replace="~{teacher/fragments_teacher :: teacher-sidebar('profile')}"></div>

    <div class="main-content">
        <div class="page-header"><h2>Quản lý Hồ sơ</h2></div>

        <div class="tabs">
            <button class="tab-btn" th:classappend="${activeTab == 'general'} ? 'active' : ''" onclick="openTab('general')"><i class="fa-solid fa-id-card"></i> Thông tin cá nhân</button>
            <button class="tab-btn" th:classappend="${activeTab == 'expertise'} ? 'active' : ''" onclick="openTab('expertise')"><i class="fa-solid fa-chalkboard-user"></i> Chuyên môn</button>
            <button class="tab-btn" th:classappend="${activeTab == 'password'} ? 'active' : ''" onclick="openTab('password')"><i class="fa-solid fa-lock"></i> Đổi mật khẩu</button>
        </div>

        <div id="general" class="tab-content" th:classappend="${activeTab == 'general'} ? 'active' : ''">
            <form id="profileForm" th:action="@{/teacher/profile/update-basic}" method="post" enctype="multipart/form-data" th:object="${userProfileDTO}">
                <div style="display: flex; gap: 30px;">
                    <div style="text-align: center;">
                        <img th:src="*{avatarUrl != null && avatarUrl != '' ? avatarUrl : '/images/home/avatar_clone.png'}" class="avatar-preview" id="previewImg">
                        <br>
                        <input type="file" name="avatarFile" id="avatarFile" accept="image/*" style="display: none;" onchange="previewFile()">
                        <button type="button" class="btn btn-secondary" style="background-color: #007bff;" onclick="document.getElementById('avatarFile').click()"><i class="fa-solid fa-upload"></i> Đổi ảnh</button>
                    </div>
                    <div style="flex: 1;">
                        <div class="form-group">
                            <label>Họ và Tên</label>
                            <input type="text" class="form-control" th:field="*{fullName}" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Địa chỉ Email (Không thể thay đổi)<span class="required">*</span></label>
                            <input type="email" class="form-control" id="email" th:value="${user.email}" readonly style="cursor: not-allowed;">
                        </div>
                        <div class="form-group" style="margin-top: 15px;">
                            <label>Số điện thoại</label>
                            <input type="text" class="form-control" th:field="*{phone}">
                        </div>
                        <div class="form-group" style="margin-top: 15px;">
                            <div class="g-recaptcha" th:data-sitekey="${recaptchaSiteKey}"></div>
                        </div>
                        <button type="submit" id="btnUpdateBasic" class="btn btn-primary" style="margin-top: 15px;">Lưu thông tin</button>
                    </div>
                </div>
            </form>
        </div>

        <div id="expertise" class="tab-content" th:classappend="${activeTab == 'expertise'} ? 'active' : ''">
            <form id="expertiseForm" th:action="@{/teacher/profile/update-expertise}" method="post" th:object="${teacherProfile}">
                <div class="form-group">
                    <label>Chuyên môn (IELTS, TESOL...)</label>
                    <input type="text" class="form-control" th:field="*{expertise}">
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Link LinkedIn</label>
                    <input type="url" class="form-control" th:field="*{linkedinUrl}">
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Giới thiệu (Bio)</label>
                    <textarea class="form-control" th:field="*{bio}" rows="5"></textarea>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <div class="g-recaptcha" th:data-sitekey="${recaptchaSiteKey}"></div>
                </div>
                <button type="submit" id="btnUpdateExpertise" class="btn btn-primary" style="margin-top: 15px;">Lưu chuyên môn</button>
            </form>
        </div>

        <div id="password" class="tab-content" th:classappend="${activeTab == 'password'} ? 'active' : ''">
            <form id="passwordForm" th:action="@{/teacher/profile/change-password}" method="post" th:object="${passwordChangeDTO}" style="max-width: 500px;">
                <div class="form-group">
                    <label>Mật khẩu hiện tại</label>
                    <input type="password" class="form-control" th:field="*{currentPassword}" required>
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Mật khẩu mới</label>
                    <input type="password" class="form-control" th:field="*{newPassword}" required minlength="6">
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <label>Nhập lại mật khẩu mới</label>
                    <input type="password" class="form-control" th:field="*{confirmPassword}" required minlength="6">
                </div>
                <div class="form-group" style="margin-top: 15px;">
                    <div class="g-recaptcha" th:data-sitekey="${recaptchaSiteKey}"></div>
                </div>
                <button type="submit" id="btnUpdatePassword" class="btn btn-primary" style="margin-top: 15px;">Đổi mật khẩu</button>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments :: sweet-alert}"></div>

    <script>
        function openTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            event.currentTarget.classList.add('active');
            window.history.replaceState(null, null, "?tab=" + tabName);
        }

        function previewFile() {
            const file = document.getElementById('avatarFile').files[0];
            const reader = new FileReader();
            reader.onloadend = function () {
                document.getElementById('previewImg').src = reader.result;
            }
            if (file) reader.readAsDataURL(file);
        }

        document.addEventListener('DOMContentLoaded', function() {
            // Đồng bộ bộ Check Captcha
            const forms = [
                { formElement: document.getElementById('profileForm'), btnElement: document.getElementById('btnUpdateBasic') },
                { formElement: document.getElementById('expertiseForm'), btnElement: document.getElementById('btnUpdateExpertise') },
                { formElement: document.getElementById('passwordForm'), btnElement: document.getElementById('btnUpdatePassword') }
            ];

            forms.forEach(item => {
                if (item.formElement && item.btnElement) {
                    item.formElement.addEventListener('submit', function(e) {
                        const captchaResponse = item.formElement.querySelector('[name="g-recaptcha-response"]');
                        if (captchaResponse && !captchaResponse.value) {
                            e.preventDefault(); 
                            Swal.fire({
                                title: 'Cảnh báo!',
                                text: 'Vui lòng xác nhận bạn không phải người máy!',
                                icon: 'warning',
                                confirmButtonText: 'Đã rõ',
                                confirmButtonColor: '#f39c12'
                            });
                            return; 
                        }
                        item.btnElement.disabled = true;
                        item.btnElement.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang xử lý...';
                        document.body.style.cursor = 'wait';
                    });
                }
            });
        });
    </script>
</body>
</html>
