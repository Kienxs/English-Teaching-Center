<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Technical Dashboard - ECE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/admin/dashboard.css">
</head>
<body>
<div class="d-flex" id="wrapper">
    <div class="border-right" id="sidebar-wrapper">
        <div class="sidebar-heading">ECE TECH SUPPORT</div>
        <div class="list-group list-group-flush">
            <a href="/admin/dashboard" class="list-group-item list-group-item-action active"><i class="fas fa-home me-2"></i> Dashboard</a>
            
            <p class="text-uppercase text-secondary ml-3 mt-3 mb-1 px-3" style="font-size: 0.75rem; font-weight: bold;">Vận hành & Sự cố</p>
            <a href="/admin/refunds" class="list-group-item list-group-item-action">
                <i class="fas fa-undo me-2"></i> Yêu cầu hoàn tiền <span class="badge bg-danger float-end">3</span>
            </a>
            <a href="/admin/transactions/errors" class="list-group-item list-group-item-action"><i class="fas fa-exclamation-triangle me-2"></i> Lỗi thanh toán</a>
            <a href="/admin/logs" class="list-group-item list-group-item-action"><i class="fas fa-terminal me-2"></i> System Logs</a>
            
            <a href="/logout" class="list-group-item list-group-item-action mt-5 text-danger"><i class="fas fa-sign-out-alt me-2"></i> Đăng xuất</a>
        </div>
    </div>

    <div id="page-content-wrapper">
        <div class="container-fluid mt-4">
            <h2 class="mb-4">Chào kỹ thuật viên, <span sec:authentication="name">Dev</span>!</h2>
            
            <div class="row">
                <div class="col-md-3">
                    <div class="card text-white bg-danger mb-3 h-100">
                        <div class="card-body">
                            <h6 class="card-title text-uppercase">Refund Pending</h6>
                            <p class="card-text display-4 mb-0">3</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-9">
                    <div class="card mb-3 shadow-sm">
                        <div class="card-header bg-white font-weight-bold">
                            <i class="fas fa-history text-danger"></i> Log giao dịch lỗi gần nhất
                        </div>
                        <div class="card-body p-0">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr><th>Mã GD</th><th>User</th><th>Lỗi</th><th>Hành động</th></tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td><span class="badge bg-secondary">#TXN-9981</span></td>
                                        <td>nguyenvana</td>
                                        <td class="text-danger">Bank timeout</td>
                                        <td><button class="btn btn-sm btn-outline-primary">Fix</button></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
