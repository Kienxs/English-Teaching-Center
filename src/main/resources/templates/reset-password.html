<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments :: headInfo('Đặt lại mật khẩu - ECE', ~{:: .custom-css})}">
    <link class="custom-css" rel="stylesheet" href="/css/login.css"/>
    <script class="custom-css" src="/js/auth-logic.js"></script>
</head>
<body>
    <nav class="navbar m-r m-l">
        <div class="row">
            <a th:href="@{/landing}"><img src="/images/landing/logo.png" alt="logo"></a>
            <button class="menu-toggle" id="menu-toggle-button">
                <img src="/images/list.png" alt="list"> 
            </button>
            <ul id="nav-links">
                <li><a th:href="@{/login}">Đăng Nhập</a></li>
                <li><a th:href="@{/register}">Đăng ký</a></li>
            </ul>
        </div>
    </nav>

    <div class="main-content">
        <div class="login-container">
            <div class="login-left">
                <img src="/images/login/login.jpg" alt="reset password illustration">
            </div>

            <div class="login-right">
                <h2>Đặt lại mật khẩu mới</h2>
                <form id="resetPasswordForm" th:action="@{/reset-password}" method="post">
                    
                    <input type="hidden" name="token" th:value="${token}">

                    <label for="password">Mật khẩu mới <span>*</span>
                        <p id="passwordHint" style="font-weight: normal; font-size: 0.85em; margin-top: 5px;"> 
                            (Tối thiểu 8 ký tự, có chữ hoa, thường, số và ký tự đặc biệt)
                        </p>
                    </label>
                    <div class="password-wrapper" style="margin-bottom: 25px;">
                        <input type="password" id="password" name="password" placeholder="Nhập mật khẩu mới" required tabindex="1">
                        <span class="toggle-password">👁️</span>
                    </div>

                    <button type="submit" id="btnReset" class="btn-login" tabindex="2">Cập nhật mật khẩu</button>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const successParam = /*[[${successMessage}]]*/ null;
        const errorParam = /*[[${errorMessage}]]*/ null;
        initAuthFeatures(successParam, errorParam, null, null);

        const passwordInput = document.querySelector('#password');
        const togglePassword = document.querySelector('.toggle-password');
        const hint = document.getElementById('passwordHint');
        const form = document.getElementById('resetPasswordForm');

        // 1. Hiển thị/Ẩn mật khẩu
        if (togglePassword && passwordInput) {
            togglePassword.addEventListener('click', () => {
                const isPassword = passwordInput.type === 'password';
                passwordInput.type = isPassword ? 'text' : 'password';
                togglePassword.textContent = isPassword ? '🙈' : '👁️';
            });
        }

        // 2. Kiểm tra độ mạnh mật khẩu
        const strongRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&._-])[A-Za-z\d@$!%*?&._-]{8,}$/;
        let isPasswordValid = false;

        passwordInput.addEventListener('input', () => {
            isPasswordValid = strongRegex.test(passwordInput.value);
            if (isPasswordValid) {
                hint.style.color = '#28a745'; 
                hint.innerHTML = '<i class="fas fa-check"></i> Mật khẩu hợp lệ';
            } else {
                hint.style.color = '#dc3545'; 
                hint.innerHTML = '(Tối thiểu 8 ký tự, có chữ hoa, thường, số và ký tự đặc biệt)';
            }
        });

        // 3. Xử lý Form Submit (Chặn nếu pass yếu, hiện loading nếu pass chuẩn)
        if(form) {
            form.addEventListener('submit', function(e) {
                if (!isPasswordValid) {
                    e.preventDefault();
                    Swal.fire('Cảnh báo', 'Vui lòng nhập mật khẩu đủ mạnh theo yêu cầu!', 'warning');
                    return;
                }
            });
        }
    });
</script>
</body>
</html>
