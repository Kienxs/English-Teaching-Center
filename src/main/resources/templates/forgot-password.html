<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments :: headInfo('Khôi phục mật khẩu - ECE', ~{:: .custom-css})}">
    <link class="custom-css" rel="stylesheet" href="/css/login.css"/>
    <script class="custom-css" src="https://www.google.com/recaptcha/api.js?hl=vi"></script>
    <script class="custom-css" src="/js/auth-logic.js"></script>
</head>
<body>
  <nav class="navbar m-r m-l">
        <div class="row">
            <a th:href="@{/landing}"><img src="/images/landing/logo.png" alt="logo"></a>

            <button class="menu-toggle" id="menu-toggle-button">
                <img src="/images/list.png" alt="list"> 
            </button>

            <ul id="nav-links">
                <li><a th:href="@{/login}">Đăng Nhập</a></li>
                <li><a th:href="@{/register}">Đăng ký</a></li>
            </ul>
        </div>
    </nav>

  <div class="main-content">
    <div class="login-container">
      <div class="login-left">
        <img src="/images/login/login.jpg" alt="forgot password illustration">
      </div>

      <div class="login-right">
          <h2>Quên mật khẩu?</h2>
          <form id="forgotPasswordForm" th:action="@{/forgot-password}" method="post">
              
              <p style="color: #666; font-size: 0.95em; margin-bottom: 25px; line-height: 1.5;">
                  Đừng lo lắng! Hãy nhập địa chỉ email bạn đã dùng để đăng ký. Chúng tôi sẽ gửi cho bạn một đường dẫn để đặt lại mật khẩu an toàn.
              </p>

              <label for="email">Địa chỉ Email <span>*</span></label>
              <input type="email" id="email" name="email" placeholder="Nhập email của bạn" required tabindex="1">

               <div class="g-recaptcha" th:attr="data-sitekey=${recaptchaSiteKey}" style="margin-bottom: 20px;"></div>

              <button type="submit" id="btnForgot" class="btn-login" tabindex="2">Gửi link khôi phục</button>
              
              <p class="register-link" style="margin-top: 20px;">
                  Nhớ ra mật khẩu rồi? <a th:href="@{/login}">Quay lại đăng nhập</a>
              </p>
          </form>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments :: footer}"></div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Lấy dữ liệu từ Controller qua Thymeleaf
        const success = /*[[${successMessage}]]*/ null;
        const error = /*[[${errorMessage}]]*/ null;

        // 2. Gọi hàm từ auth-logic.js để hiển thị Popup
        if (typeof initAuthFeatures === 'function') {
            initAuthFeatures(success, error, null);
        }

        // 3. Logic xử lý Loading Spinner riêng cho form này
        const form = document.getElementById('forgotPasswordForm');
        const btn = document.getElementById('btnForgot');

        if(form && btn) {
            form.addEventListener('submit', function() {
                btn.disabled = true;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Đang gửi email...';
                document.body.style.cursor = 'wait';
            });
        }
    });
</script>
</body>
</html>
