<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="/css/register.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://www.google.com/recaptcha/api.js?hl=vi"></script>
    <script src="/js/main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/js/auth-logic.js"></script>
</head>
<body>
    <nav class="navbar m-r m-l">
        <div class="row">
            <a th:href="@{/landing}"><img src="/images/landing/logo.png" alt="logo"></a>

            <button class="menu-toggle" id="menu-toggle-button">
                <img src="/images/list.png" alt="list"> 
            </button>

            <ul id="nav-links">
                <li><a th:href="@{/login}">Đăng Nhập</a></li>
                <li><a th:href="@{/register}">Đăng ký</a></li>
            </ul>
        </div>
    </nav>

    <div class="register-container">
        <div class="register-card">
            <div class="register-left">
                <img src="/images/register/register.jpg" alt="students">
            </div>
            <div class="register-right">
                <h2>Đăng ký tài khoản</h2>
                <form id="registerForm" th:action="@{/register}" th:object="${user}" method="post">

                    <label for="fullname">Họ và Tên <span>*</span></label>
                    <input type="text" id="fullname" th:field="*{fullName}" name="fullname" placeholder="Nhập Họ và Tên của bạn" required tabindex="1">

                    <label for="email">Email  <span>*</span></label>
                    <input type="email" id="email" th:field="*{email}" name="email" placeholder="Nhập email của bạn" required tabindex="2">

                    <label for="phone">Số điện thoại<span>*</span></label>
                    <input type="tel" id="phone" th:field="*{phone}" name="phone" placeholder="Nhập số điện thoại của bạn" pattern="\d{10,12}" required tabindex="3">

                    <label for="password">Mật khẩu <span>*</span>
                        <p id="passwordHint"> (Tối thiểu 8 ký tự, có chữ hoa, thường, số và ký tự đặc biệt)</p>
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" th:field="*{password}" name="password" placeholder="Nhập mật khẩu" required tabindex="4">
                        <span class="toggle-password">👁️</span>
                    </div>
                    
                    <div class="g-recaptcha" th:attr="data-sitekey=${recaptchaSiteKey}"></div>

                    <button type="submit" id="btnRegister" class="btn-register" tabindex="5">Đăng ký</button>
                </form>

                <p class="login-link">Đã có tài khoản? <a th:href="@{/login}">Đăng nhập ngay</a></p>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
</body>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.querySelector('#password');
        const togglePassword = document.querySelector('.toggle-password');
        const hint = document.getElementById('passwordHint');

        // 1. Hiển thị/Ẩn mật khẩu
        togglePassword.addEventListener('click', () => {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
            togglePassword.textContent = isPassword ? '🙈' : '👁️';
        });

        // 2. Kiểm tra độ mạnh mật khẩu (Frontend Validation)
        const strongRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&._-])[A-Za-z\d@$!%*?&._-]{8,}$/;
        passwordInput.addEventListener('input', () => {
            if (strongRegex.test(passwordInput.value)) {
                hint.style.color = '#28a745'; // Màu xanh nếu hợp lệ
                hint.innerHTML = '<i class="fas fa-check"></i> Mật khẩu hợp lệ';
            } else {
                hint.style.color = '#dc3545'; // Màu đỏ nếu không hợp lệ
                hint.innerHTML = '(Tối thiểu 8 ký tự, có chữ hoa, thường, số và ký tự đặc biệt)';
            }
        });

        // 3. Xử lý Pop-up & Loading (Gọi từ file auth-logic.js)
        const success = /*[[${successMessage}]]*/ null;
        const error = /*[[${errorMessage}]]*/ null;
        const captcha = /*[[${captchaErrorMessage}]]*/ null;
        
        // Hàm này nằm trong static/js/auth-logic.js
        initAuthFeatures(success, error, captcha);
    });
</script>

</html>
