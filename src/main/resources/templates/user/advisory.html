<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: headInfo('Đăng ký nhận tư vấn miễn phí - ECE English', ~{:: .custom-css})}">
    <link class="custom-css" rel="stylesheet" href="/css/user/advisory.css"/>
</head>
<body>
    <div th:replace="~{fragments :: navbar('advisory')}"></div>

    <main class="consultation-page">
        <div class="logo-column">
            
            <div class="logo-image">
                <img src="/images/home/iLogo.png" alt="ECE English Center Logo" class="center-logo">
                <div class="circular-text" id="circularText">
            </div>
    </div>
        </div>

        <div class="form-column">
            <h1>Đăng ký nhận tư vấn miễn phí</h1>
            <p>Quý Phụ huynh Học sinh vui lòng để lại thông tin bên dưới để nhận tư vấn về các khóa học.</p>

            <form action="/submit-consultation" method="POST" class="consult-form">
                <div class="form-group">
                    <label for="full-name">Họ và tên <span class="required">*</span></label>
                    <input type="text" id="full-name" name="fullName" placeholder="Họ và Tên học viên" required>
                </div>
                <div class="form-group">
                    <label for="birth-year">Năm sinh</label>
                    <input type="text" id="birth-year" name="birthYear" placeholder="Năm sinh của học viên">
                </div>
                
                <div class="form-group">
                    <label for="phone">Số điện thoại</label>
                    <input type="tel" id="phone" name="phone" placeholder="Số điện thoại phụ huynh">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="Nhập email phụ huynh">
                </div>

                <div class="form-group full-width">
                    <label for="course">Khóa học quan tâm</label>
                    <select id="course" name="course">
                        <option value="">---</option>
                        <option value="ielts">IELTS 6.0</option>
                        <option value="aef">Tiếng Anh cấp 2 (AEF)</option>
                        <option value="kids">Tiếng Anh trẻ em</option>
                        <option value="other">Khóa học khác</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="message">Nội dung cần hỗ trợ</label>
                    <textarea id="message" name="message" placeholder="Vui lòng để lại lời nhắn nếu có" rows="5"></textarea>
                </div>

                <div class="button-container full-width">
                    <button type="submit" class="btn-submit-consult">
                        Gửi thông tin <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments :: footer}"></div>
</body>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const text = "English Center For Everyone • ECE • "; // Chuỗi văn bản muốn xoay
    const circularTextElement = document.getElementById('circularText');
    const radius = circularTextElement.offsetWidth / 2; // Bán kính của vòng tròn
    const deg = 360 / text.length; // Góc cho mỗi chữ cái

    // Tạo span cho mỗi ký tự và định vị chúng
    for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const span = document.createElement('span');
        span.textContent = char;

        // Nếu là dấu chấm, thêm class 'dot' để định dạng khác (tùy chọn)
        if (char === '•') {
            span.classList.add('dot');
        }

        // Áp dụng phép xoay và dịch chuyển cho mỗi chữ cái
        span.style.transform = `rotate(${deg * i}deg) translateY(-${radius}px)`;
        
        circularTextElement.appendChild(span);
    }
});
</script>
</html>
