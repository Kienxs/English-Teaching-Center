<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: headInfo('News - ECE English', ~{:: .custom-css})}">
    <link class="custom-css" rel="stylesheet" href="/css/user/news.css"/>
</head>
<body>
    <div th:replace="~{fragments :: navbar('news')}"></div>

    <main>
        <section class="event-hero">
            <div class="container hero-content">
                <h1>News</h1>
                <p>Chào mừng bạn đến với chuyên mục News của Trung tâm Ngoại ngữ ECE! 
                    Đây là nơi tổng hợp mọi thông tin về các bài viết, trải nghiệm, học thuật đến từ các hoạt động ngoại khóa.</p>
            </div>
            <div class="dots-decorator"></div>
        </section>

        <section class="event-list-section">
            <div class="container">
                
                <div class="event-grid">
                    <article class="event-card" th:each="post : ${postPage.content}">
                        <a th:href="@{/user/post/{slug}(slug=${post.slug})}" class="card-image-link">
                            <img th:src="${post.thumbnailUrl != null ? post.thumbnailUrl : '/images/default-post.jpg'}" 
                                th:alt="${post.title}" class="card-image">
                        </a>
                        <div class="card-content">
                            <span class="card-date" th:text="${#temporals.format(post.createdAt, 'dd/MM/yyyy')}">28/10/2025</span>
                            <h2 class="card-title">
                                <a th:href="@{/user/post/{slug}(slug=${post.slug})}" th:text="${post.title}">Tiêu đề bài viết</a>
                            </h2>
                            <p class="card-snippet" th:text="${post.summary}"></p>
                        </div>
                    </article>
                </div>

                <div class="pagination-container" th:if="${postPage.totalPages > 1}" style="text-align: center; margin-top: 30px;">
                    <a th:if="${postPage.hasPrevious()}" 
                    th:href="@{''(page=${postPage.number})}" class="btn-page"> &laquo; Trước </a>

                    <span th:each="i : ${#numbers.sequence(1, postPage.totalPages)}">
                        <a th:href="@{''(page=${i})}" 
                        th:text="${i}" 
                        th:style="${i == postPage.number + 1 ? 'font-weight:bold; color:red; margin: 0 10px;' : 'margin: 0 10px;'}">
                        </a>
                    </span>

                    <a th:if="${postPage.hasNext()}" 
                    th:href="@{''(page=${postPage.number + 2})}" class="btn-page"> Sau &raquo; </a>
                </div>

            </div>
        </section>
    </main>

    <div th:replace="~{fragments :: footer}"></div>
</body>
</html>
